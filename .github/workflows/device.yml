name: Device check

# Runs the journey in integration_test/ on a real Android runtime, because the
# widget tests in test/ exercise a mocked storage plugin and this one exercises
# the real one. It is slower than the main CI job and it needs an emulator, so it
# lives in its own workflow rather than holding up every push's feedback.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Do NOT cancel in progress. The emulator journey takes about fifteen minutes
# and this workflow triggers on every push, so cancel-in-progress meant that a
# normal run of commits killed the check over and over: five consecutive
# rounds showed it pending, and one cancelled while it was already inside the
# test. The check is expensive but it is the only one that exercises the real
# Android storage plugin, so it must be allowed to finish.
concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-journey:
    name: Journey on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The plain AOSP image, not Google APIs: this test needs no Play services,
      # and the leaner image boots sooner and has fewer background processes
      # fighting the emulator for the runner's CPU.
      #
      # Note that the action runs each line of 'script' as its own command, so
      # every line below has to stand alone; the wait loop lives inside the
      # quoted adb command, where the device's shell can run it.
      - name: Run the journey on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -camera-back none -camera-front none
          # 'timeout' turns a wedged run into a fast, readable failure. A test
          # that never returns otherwise burns the whole job budget and reports
          # only 'the operation was canceled'.
          script: |
            adb wait-for-device
            adb shell 'until pm list packages > /dev/null 2>&1; do sleep 2; done'
            # A bare `timeout` exit reads like a failing test, and a slow boot
            # here has already been mistaken for one: the journey was killed at
            # the 900 s ceiling after six minutes of booting, and exit code 124
            # says nothing about the app. Wait for a completed boot explicitly
            # and say so if it never comes, then give the test a ceiling that
            # fits the job 40-minute budget.
            for i in $(seq 1 60); do
              boot=$(adb shell getprop sys.boot_completed | tr -d "\r")
              [ "$boot" = "1" ] && break
              sleep 5
            done
            if [ "$boot" != "1" ]; then
              echo "::error::emulator never finished booting (sys.boot_completed=$boot) - infrastructure, not the journey"
              exit 1
            fi
            timeout 1500 flutter test integration_test/journey_test.dart -d emulator-5554

name: Device check

# Runs the journey in integration_test/ on a real Android runtime, because the
# widget tests in test/ exercise a mocked storage plugin and this one exercises
# the real one. It is slower than the main CI job and it needs an emulator, so it
# lives in its own workflow rather than holding up every push's feedback.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-journey:
    name: Journey on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The plain AOSP image, not Google APIs: this test needs no Play services,
      # and the leaner image boots sooner and has far fewer background processes
      # fighting the emulator for the runner's CPU.
      - name: Run the journey on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -no-snapshot -camera-back none -camera-front none
          script: |
            set -e
            # The action reports the device as started before the package
            # manager is serving requests, and 'flutter test' installs
            # immediately: without this wait the run dies with
            # "Can't find service: package".
            adb wait-for-device
            echo "waiting for the package service"
            for attempt in $(seq 1 60); do
              if adb shell pm list packages >/dev/null 2>&1; then
                echo "package service answered after $((attempt * 5))s"
                break
              fi
              sleep 5
            done
            adb shell pm list packages | head -3
            adb shell getprop sys.boot_completed
            flutter test integration_test/journey_test.dart -d emulator-5554
